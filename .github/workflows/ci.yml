name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the context-docs check diffs against the PR base

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same command as local development: proves the setup script rebuilds
      # the environment from nothing (pinned Supabase CLI from package.json).
      - name: Set up environment
        run: npm run setup

      - name: All tests (typecheck, lint, unit, pgTAP, types drift, integration)
        run: npm run test:all

      - name: Context docs updated with schema/dependency changes
        if: github.event_name == 'pull_request'
        run: bash scripts/check-context-docs.sh "origin/${{ github.base_ref }}"
